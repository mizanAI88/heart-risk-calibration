# Three classifiers, each wrapped in a sklearn Pipeline of
# SimpleImputer(median) -> StandardScaler -> classifier.
# `fixed` parameters are passed to the classifier constructor; `grid` values
# are searched by the inner cross-validation of each outer fold.
models:
  logistic_regression:
    fixed:
      solver: lbfgs
      max_iter: 1000
    grid:
      C: [0.1, 1.0, 10.0]
  hist_gradient_boosting:
    # max_bins 32: the 13 columns hold few distinct values and the tables are
    # small, so 255 bins would only add binning cost.
    fixed:
      max_iter: 60
      max_bins: 32
      max_leaf_nodes: 15
      min_samples_leaf: 10
      early_stopping: false
    grid:
      learning_rate: [0.05, 0.1]
  mlp:
    # sklearn MLPClassifier: one hidden layer, L-BFGS solver (small data,
    # deterministic given the seed), no early stopping. The L2 penalty grid is
    # deliberately strong: a few hundred rows and a 16-unit layer saturate to
    # 0/1 outputs otherwise.
    fixed:
      hidden_layer_sizes: [16]
      solver: lbfgs
      max_iter: 300
    grid:
      alpha: [0.3, 3.0]
